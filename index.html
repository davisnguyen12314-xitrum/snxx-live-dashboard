<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Binance Live Tracker</title>


<!-- ===================================================== -->
<!-- TRADINGVIEW LIGHTWEIGHT CHARTS -->
<!-- ===================================================== -->

<script
    src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js">
</script>


<style>

/* ===================================================== */
/* GENERAL */
/* ===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #0f1115;

    color: white;

}


.container {

    max-width: 1200px;

    margin: auto;

    padding: 25px;

}


h1 {

    text-align: center;

    margin-bottom: 30px;

    font-size: 32px;

}


/* ===================================================== */
/* CARDS */
/* ===================================================== */

.cards {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;

}


.card {

    background: #181b22;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.3);

}


.symbol {

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 15px;

}


.price {

    font-size: 38px;

    font-weight: bold;

    margin-bottom: 10px;

}


.live {

    font-size: 14px;

    margin-bottom: 25px;

}


/* ===================================================== */
/* INPUT */
/* ===================================================== */

.input-label {

    font-size: 14px;

    color: #aaa;

}


input {

    width: 100%;

    padding: 14px;

    margin-top: 8px;

    margin-bottom: 10px;

    border-radius: 10px;

    border: 1px solid #444;

    background: #0f1115;

    color: white;

    font-size: 18px;

}


/* ===================================================== */
/* BUTTON */
/* ===================================================== */

button {

    width: 100%;

    padding: 12px;

    margin-bottom: 20px;

    border-radius: 10px;

    border: 1px solid #444;

    background: #252a33;

    color: white;

    font-size: 15px;

    cursor: pointer;

    transition:
        background 0.2s,
        border 0.2s;

}


button:hover {

    background: #333a46;

}


button:active {

    background: #444c59;

}


/* ===================================================== */
/* TIMEFRAME BUTTONS */
/* ===================================================== */

.timeframes {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;

    margin-top: 10px;

    margin-bottom: 10px;

}


.timeframes button {

    margin: 0;

    padding: 8px 4px;

    font-size: 12px;

}


.timeframes button.active {

    background: #2962ff;

    border-color: #2962ff;

    font-weight: bold;

}


/* ===================================================== */
/* CHART */
/* ===================================================== */

.chart {

    width: 100%;

    height: 350px;

    margin-top: 10px;

    border-radius: 10px;

    overflow: hidden;

}


/* ===================================================== */
/* CHANGE */
/* ===================================================== */

.change {

    font-size: 30px;

    font-weight: bold;

    margin-top: 10px;

}


/* ===================================================== */
/* UPDATED */
/* ===================================================== */

.updated {

    margin-top: 20px;

    color: #888;

    font-size: 13px;

}


/* ===================================================== */
/* CHART STATUS */
/* ===================================================== */

.chart-status {

    color: #888;

    font-size: 12px;

    margin-top: 5px;

}


/* ===================================================== */
/* FOOTER */
/* ===================================================== */

.footer {

    text-align: center;

    color: #666;

    font-size: 12px;

    margin-top: 30px;

    padding-bottom: 20px;

}


/* ===================================================== */
/* MOBILE */
/* ===================================================== */

@media(max-width: 700px) {

    .container {

        padding: 15px;

    }


    .cards {

        grid-template-columns: 1fr;

    }


    h1 {

        font-size: 26px;

    }


    .price {

        font-size: 34px;

    }


    .chart {

        height: 300px;

    }


    .timeframes {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 5px;

    }

}


</style>

</head>


<body>


<div class="container">


<h1>
    Binance Live Tracker
</h1>


<div class="cards">


<!-- ===================================================== -->
<!-- SNXX -->
<!-- ===================================================== -->

<div class="card">


<div class="symbol">
    SNXXBUSDT
</div>


<div id="snxxPrice"
     class="price">

    Connecting...

</div>


<div id="snxxStatus"
     class="live">

    ● Connecting

</div>


<!-- LAST SOLD PRICE -->

<div class="input-label">

    Last Sold Price

</div>


<input
    id="snxxSold"
    type="number"
    step="any"
    placeholder="Enter last sold price"
>


<button id="clearSnxx">

    Clear Saved Price

</button>


<!-- PERCENT CHANGE -->

<div id="snxxChange"
     class="change">

    --

</div>


<div id="snxxUpdated"
     class="updated">

    Waiting for Binance...

</div>


<!-- ================================================= -->
<!-- SNXX CHART -->
<!-- ================================================= -->

<div class="input-label"
     style="margin-top:25px;">

    Live Chart

</div>


<div class="timeframes"
     id="snxxTimeframes">


<button
    data-interval="1m"
    class="active">

    1m

</button>


<button
    data-interval="5m">

    5m

</button>


<button
    data-interval="15m">

    15m

</button>


<button
    data-interval="30m">

    30m

</button>


<button
    data-interval="1h">

    1h

</button>


<button
    data-interval="4h">

    4h

</button>


<button
    data-interval="1d">

    1D

</button>


</div>


<div id="snxxChart"
     class="chart">

</div>


<div id="snxxChartStatus"
     class="chart-status">

    Loading chart...

</div>


</div>


<!-- ===================================================== -->
<!-- SNDKB -->
<!-- ===================================================== -->

<div class="card">


<div class="symbol">
    SNDKBUSDT
</div>


<div id="sndkbPrice"
     class="price">

    Connecting...

</div>


<div id="sndkbStatus"
     class="live">

    ● Connecting

</div>


<!-- LAST SOLD PRICE -->

<div class="input-label">

    Last Sold Price

</div>


<input
    id="sndkbSold"
    type="number"
    step="any"
    placeholder="Enter last sold price"
>


<button id="clearSndkb">

    Clear Saved Price

</button>


<!-- PERCENT CHANGE -->

<div id="sndkbChange"
     class="change">

    --

</div>


<div id="sndkbUpdated"
     class="updated">

    Waiting for Binance...

</div>


<!-- ================================================= -->
<!-- SNDKB CHART -->
<!-- ================================================= -->

<div class="input-label"
     style="margin-top:25px;">

    Live Chart

</div>


<div class="timeframes"
     id="sndkbTimeframes">


<button
    data-interval="1m"
    class="active">

    1m

</button>


<button
    data-interval="5m">

    5m

</button>


<button
    data-interval="15m">

    15m

</button>


<button
    data-interval="30m">

    30m

</button>


<button
    data-interval="1h">

    1h

</button>


<button
    data-interval="4h">

    4h

</button>


<button
    data-interval="1d">

    1D

</button>


</div>


<div id="sndkbChart"
     class="chart">

</div>


<div id="sndkbChartStatus"
     class="chart-status">

    Loading chart...

</div>


</div>


</div>


<div class="footer">

    Charts powered by TradingView Lightweight Charts

</div>


</div>


<script>


// =====================================================
// VARIABLES
// =====================================================

let snxxPrice = null;

let sndkbPrice = null;


// =====================================================
// LOAD SAVED PRICES
// =====================================================

const savedSNXX =
    localStorage.getItem(
        "snxxLastSoldPrice"
    );


if (savedSNXX !== null) {

    document.getElementById(
        "snxxSold"
    ).value = savedSNXX;

}


const savedSNDKB =
    localStorage.getItem(
        "sndkbLastSoldPrice"
    );


if (savedSNDKB !== null) {

    document.getElementById(
        "sndkbSold"
    ).value = savedSNDKB;

}


// =====================================================
// FORMAT PRICE
// =====================================================

function formatPrice(price) {

    return Number(price)
        .toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 6,
                maximumFractionDigits: 8
            }
        );

}


// =====================================================
// CALCULATE CHANGE
// =====================================================

function calculateChange(
    livePrice,
    soldPrice
) {

    if (

        livePrice === null ||

        soldPrice === null ||

        soldPrice <= 0

    ) {

        return null;

    }


    return (

        (livePrice - soldPrice)
        / soldPrice

    ) * 100;

}


// =====================================================
// UPDATE SNXX
// =====================================================

function updateSNXX() {

    const sold =
        parseFloat(
            document.getElementById(
                "snxxSold"
            ).value
        );


    const change =
        calculateChange(
            snxxPrice,
            sold
        );


    const element =
        document.getElementById(
            "snxxChange"
        );


    if (change === null) {

        element.innerText = "--";

        return;

    }


    const sign =
        change >= 0
            ? "+"
            : "";


    element.innerText =
        sign +
        change.toFixed(2) +
        "%";


    if (change > 0) {

        element.style.color =
            "#00c853";

    }

    else if (change < 0) {

        element.style.color =
            "#ff5252";

    }

    else {

        element.style.color =
            "white";

    }

}


// =====================================================
// UPDATE SNDKB
// =====================================================

function updateSNDKB() {

    const sold =
        parseFloat(
            document.getElementById(
                "sndkbSold"
            ).value
        );


    const change =
        calculateChange(
            sndkbPrice,
            sold
        );


    const element =
        document.getElementById(
            "sndkbChange"
        );


    if (change === null) {

        element.innerText = "--";

        return;

    }


    const sign =
        change >= 0
            ? "+"
            : "";


    element.innerText =
        sign +
        change.toFixed(2) +
        "%";


    if (change > 0) {

        element.style.color =
            "#00c853";

    }

    else if (change < 0) {

        element.style.color =
            "#ff5252";

    }

    else {

        element.style.color =
            "white";

    }

}


// =====================================================
// SNXX INPUT
// =====================================================

document.getElementById(
    "snxxSold"
).addEventListener(
    "input",
    function() {

        localStorage.setItem(
            "snxxLastSoldPrice",
            this.value
        );


        updateSNXX();

    }
);


// =====================================================
// SNDKB INPUT
// =====================================================

document.getElementById(
    "sndkbSold"
).addEventListener(
    "input",
    function() {

        localStorage.setItem(
            "sndkbLastSoldPrice",
            this.value
        );


        updateSNDKB();

    }
);


// =====================================================
// CLEAR SNXX
// =====================================================

document.getElementById(
    "clearSnxx"
).addEventListener(
    "click",
    function() {

        localStorage.removeItem(
            "snxxLastSoldPrice"
        );


        document.getElementById(
            "snxxSold"
        ).value = "";


        updateSNXX();

    }
);


// =====================================================
// CLEAR SNDKB
// =====================================================

document.getElementById(
    "clearSndkb"
).addEventListener(
    "click",
    function() {

        localStorage.removeItem(
            "sndkbLastSoldPrice"
        );


        document.getElementById(
            "sndkbSold"
        ).value = "";


        updateSNDKB();

    }
);


// =====================================================
// BINANCE LIVE TICKER - SNXX
// =====================================================

const snxxWS =
    new WebSocket(
        "wss://stream.binance.com:9443/ws/snxxbusdt@ticker"
    );


snxxWS.onopen = function() {

    document.getElementById(
        "snxxStatus"
    ).innerText =
        "● LIVE";

};


snxxWS.onmessage = function(event) {

    const data =
        JSON.parse(event.data);


    snxxPrice =
        parseFloat(data.c);


    document.getElementById(
        "snxxPrice"
    ).innerText =
        "$" +
        formatPrice(snxxPrice);


    document.getElementById(
        "snxxUpdated"
    ).innerText =
        "Last update: " +
        new Date().toLocaleTimeString();


    updateSNXX();

};


snxxWS.onerror = function() {

    document.getElementById(
        "snxxStatus"
    ).innerText =
        "● Connection error";

};


snxxWS.onclose = function() {

    document.getElementById(
        "snxxStatus"
    ).innerText =
        "● Disconnected";

};


// =====================================================
// BINANCE LIVE TICKER - SNDKB
// =====================================================

const sndkbWS =
    new WebSocket(
        "wss://stream.binance.com:9443/ws/sndkbusdt@ticker"
    );


sndkbWS.onopen = function() {

    document.getElementById(
        "sndkbStatus"
    ).innerText =
        "● LIVE";

};


sndkbWS.onmessage = function(event) {

    const data =
        JSON.parse(event.data);


    sndkbPrice =
        parseFloat(data.c);


    document.getElementById(
        "sndkbPrice"
    ).innerText =
        "$" +
        formatPrice(sndkbPrice);


    document.getElementById(
        "sndkbUpdated"
    ).innerText =
        "Last update: " +
        new Date().toLocaleTimeString();


    updateSNDKB();

};


sndkbWS.onerror = function() {

    document.getElementById(
        "sndkbStatus"
    ).innerText =
        "● Connection error";

};


sndkbWS.onclose = function() {

    document.getElementById(
        "sndkbStatus"
    ).innerText =
        "● Disconnected";

};


// =====================================================
// CHART CONFIGURATION
// =====================================================

const chartOptions = {

    layout: {

        background: {

            type: "solid",

            color: "#181b22"

        },

        textColor: "#aaaaaa"

    },


    grid: {

        vertLines: {

            color: "#252a33"

        },

        horzLines: {

            color: "#252a33"

        }

    },


    rightPriceScale: {

        borderColor: "#444444"

    },


    timeScale: {

        borderColor: "#444444",

        timeVisible: true,

        secondsVisible: false

    },


    crosshair: {

        mode:
            LightweightCharts.CrosshairMode.Normal

    }

};


// =====================================================
// CREATE SNXX CHART
// =====================================================

const snxxChart =
    LightweightCharts.createChart(

        document.getElementById(
            "snxxChart"
        ),

        chartOptions

    );


let snxxSeries =
    snxxChart.addSeries(
        LightweightCharts.CandlestickSeries,
        {

            upColor: "#00c853",

            downColor: "#ff5252",

            borderVisible: false,

            wickUpColor: "#00c853",

            wickDownColor: "#ff5252"

        }
    );


// =====================================================
// CREATE SNDKB CHART
// =====================================================

const sndkbChart =
    LightweightCharts.createChart(

        document.getElementById(
            "sndkbChart"
        ),

        chartOptions

    );


let sndkbSeries =
    sndkbChart.addSeries(
        LightweightCharts.CandlestickSeries,
        {

            upColor: "#00c853",

            downColor: "#ff5252",

            borderVisible: false,

            wickUpColor: "#00c853",

            wickDownColor: "#ff5252"

        }
    );


// =====================================================
// CHART WEBSOCKETS
// =====================================================

let snxxChartWS = null;

let sndkbChartWS = null;


// =====================================================
// LOAD BINANCE KLINES
// =====================================================

async function loadKlines(

    symbol,

    interval,

    series,

    chart,

    statusElement

) {

    try {

        statusElement.innerText =
            "Loading " +
            interval +
            " chart...";


        const url =

            "https://api.binance.com/api/v3/klines" +

            "?symbol=" +
            symbol +

            "&interval=" +
            interval +

            "&limit=300";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Binance API error"
            );

        }


        const data =
            await response.json();


        const candles =
            data.map(
                function(item) {

                    return {

                        time:
                            Math.floor(
                                item[0] / 1000
                            ),

                        open:
                            parseFloat(item[1]),

                        high:
                            parseFloat(item[2]),

                        low:
                            parseFloat(item[3]),

                        close:
                            parseFloat(item[4])

                    };

                }
            );


        series.setData(candles);


        chart
            .timeScale()
            .fitContent();


        statusElement.innerText =
            "● LIVE " +
            interval;


    }

    catch(error) {

        console.error(
            symbol +
            " chart error:",
            error
        );


        statusElement.innerText =
            "● Chart connection error";

    }

}


// =====================================================
// START SNXX CHART WEBSOCKET
// =====================================================

function startSNXXChartWS(
    interval
) {


    // Close previous websocket

    if (
        snxxChartWS !== null
    ) {

        snxxChartWS.close();

    }


    const url =

        "wss://stream.binance.com:9443/ws/" +

        "snxxbusdt@kline_" +

        interval;


    snxxChartWS =
        new WebSocket(url);


    snxxChartWS.onopen =
        function() {

            console.log(
                "SNXX chart connected:",
                interval
            );

        };


    snxxChartWS.onmessage =
        function(event) {

            const data =
                JSON.parse(
                    event.data
                );


            const k =
                data.k;


            const candle = {

                time:
                    Math.floor(
                        k.t / 1000
                    ),

                open:
                    parseFloat(k.o),

                high:
                    parseFloat(k.h),

                low:
                    parseFloat(k.l),

                close:
                    parseFloat(k.c)

            };


            snxxSeries.update(
                candle
            );

        };


    snxxChartWS.onerror =
        function(error) {

            console.error(
                "SNXX chart WebSocket error",
                error
            );

        };


    snxxChartWS.onclose =
        function() {

            console.log(
                "SNXX chart WebSocket closed"
            );

        };

}


// =====================================================
// START SNDKB CHART WEBSOCKET
// =====================================================

function startSNDKBChartWS(
    interval
) {


    // Close previous websocket

    if (
        sndkbChartWS !== null
    ) {

        sndkbChartWS.close();

    }


    const url =

        "wss://stream.binance.com:9443/ws/" +

        "sndkbusdt@kline_" +

        interval;


    sndkbChartWS =
        new WebSocket(url);


    sndkbChartWS.onopen =
        function() {

            console.log(
                "SNDKB chart connected:",
                interval
            );

        };


    sndkbChartWS.onmessage =
        function(event) {

            const data =
                JSON.parse(
                    event.data
                );


            const k =
                data.k;


            const candle = {

                time:
                    Math.floor(
                        k.t / 1000
                    ),

                open:
                    parseFloat(k.o),

                high:
                    parseFloat(k.h),

                low:
                    parseFloat(k.l),

                close:
                    parseFloat(k.c)

            };


            sndkbSeries.update(
                candle
            );

        };


    sndkbChartWS.onerror =
        function(error) {

            console.error(
                "SNDKB chart WebSocket error",
                error
            );

        };


    sndkbChartWS.onclose =
        function() {

            console.log(
                "SNDKB chart WebSocket closed"
            );

        };

}


// =====================================================
// LOAD SNXX CHART
// =====================================================

async function changeSNXXTimeframe(
    interval
) {


    // Stop old websocket

    if (
        snxxChartWS !== null
    ) {

        snxxChartWS.close();

    }


    // Load historical data

    await loadKlines(

        "SNXXBUSDT",

        interval,

        snxxSeries,

        snxxChart,

        document.getElementById(
            "snxxChartStatus"
        )

    );


    // Start live websocket

    startSNXXChartWS(
        interval
    );

}


// =====================================================
// LOAD SNDKB CHART
// =====================================================

async function changeSNDKBTimeframe(
    interval
) {


    // Stop old websocket

    if (
        sndkbChartWS !== null
    ) {

        sndkbChartWS.close();

    }


    // Load historical data

    await loadKlines(

        "SNDKBUSDT",

        interval,

        sndkbSeries,

        sndkbChart,

        document.getElementById(
            "sndkbChartStatus"
        )

    );


    // Start live websocket

    startSNDKBChartWS(
        interval
    );

}


// =====================================================
// SNXX TIMEFRAME BUTTONS
// =====================================================

document
    .querySelectorAll(
        "#snxxTimeframes button"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                async function() {

                    document
                        .querySelectorAll(
                            "#snxxTimeframes button"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    const interval =
                        this.dataset.interval;


                    await changeSNXXTimeframe(
                        interval
                    );

                }
            );

        }
    );


// =====================================================
// SNDKB TIMEFRAME BUTTONS
// =====================================================

document
    .querySelectorAll(
        "#sndkbTimeframes button"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                async function() {

                    document
                        .querySelectorAll(
                            "#sndkbTimeframes button"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    const interval =
                        this.dataset.interval;


                    await changeSNDKBTimeframe(
                        interval
                    );

                }
            );

        }
    );


// =====================================================
// INITIALIZE CHARTS
// =====================================================

changeSNXXTimeframe(
    "1m"
);


changeSNDKBTimeframe(
    "1m"
);


// =====================================================
// RESPONSIVE CHART SIZE
// =====================================================

window.addEventListener(
    "resize",
    function() {

        const snxxContainer =
            document.getElementById(
                "snxxChart"
            );


        const sndkbContainer =
            document.getElementById(
                "sndkbChart"
            );


        snxxChart.resize(

            snxxContainer.clientWidth,

            snxxContainer.clientHeight

        );


        sndkbChart.resize(

            sndkbContainer.clientWidth,

            sndkbContainer.clientHeight

        );

    }
);


</script>


</body>

</html>
