<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Binance Live Tracker</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #0f1115;

    color: white;

}

.container {

    max-width: 1000px;

    margin: auto;

    padding: 25px;

}

h1 {

    text-align: center;

    margin-bottom: 30px;

    font-size: 32px;

}

.cards {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;

}

.card {

    background: #181b22;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.3);

}

.symbol {

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 15px;

}

.price {

    font-size: 38px;

    font-weight: bold;

    margin-bottom: 10px;

}

.live {

    font-size: 14px;

    margin-bottom: 25px;

}

.input-label {

    font-size: 14px;

    color: #aaa;

}

input {

    width: 100%;

    padding: 14px;

    margin-top: 8px;

    margin-bottom: 10px;

    border-radius: 10px;

    border: 1px solid #444;

    background: #0f1115;

    color: white;

    font-size: 18px;

}

button {

    width: 100%;

    padding: 12px;

    margin-bottom: 20px;

    border-radius: 10px;

    border: 1px solid #444;

    background: #252a33;

    color: white;

    font-size: 15px;

    cursor: pointer;

    transition: background 0.2s;

}

button:hover {

    background: #333a46;

}

button:active {

    background: #444c59;

}

.change {

    font-size: 30px;

    font-weight: bold;

    margin-top: 10px;

}

.updated {

    margin-top: 20px;

    color: #888;

    font-size: 13px;

}

@media(max-width: 700px) {

    .cards {

        grid-template-columns: 1fr;

    }

    h1 {

        font-size: 26px;

    }

    .price {

        font-size: 34px;

    }

}

</style>

</head>

<body>

<div class="container">

<h1>
    Binance Live Tracker
</h1>

<div class="cards">

<!-- ================================================= -->

<!-- SNXX -->

<!-- ================================================= -->

<div class="card">

<div class="symbol">
    SNXXBUSDT
</div>

<div id="snxxPrice"
     class="price">
    Connecting...
</div>

<div id="snxxStatus"
     class="live">
    ● Connecting
</div>

<div class="input-label">
    Last Sold Price
</div>

<input
id="snxxSold"
type="number"
step="any"
placeholder="Enter last sold price"

>

<button id="clearSnxx">
    Clear Saved Price
</button>

<div id="snxxChange"
     class="change">
    --
</div>

<div id="snxxUpdated"
     class="updated">
    Waiting for Binance...
</div>

</div>

<!-- ================================================= -->

<!-- SNDKB -->

<!-- ================================================= -->

<div class="card">

<div class="symbol">
    SNDKBUSDT
</div>

<div id="sndkbPrice"
     class="price">
    Connecting...
</div>

<div id="sndkbStatus"
     class="live">
    ● Connecting
</div>

<div class="input-label">
    Last Sold Price
</div>

<input
id="sndkbSold"
type="number"
step="any"
placeholder="Enter last sold price"

>

<button id="clearSndkb">
    Clear Saved Price
</button>

<div id="sndkbChange"
     class="change">
    --
</div>

<div id="sndkbUpdated"
     class="updated">
    Waiting for Binance...
</div>

</div>

</div>

</div>

<script>


// =====================================================
// VARIABLES
// =====================================================

let snxxPrice = null;

let sndkbPrice = null;


// =====================================================
// LOAD SAVED PRICES FROM LOCAL STORAGE
// =====================================================

// Load SNXX

const savedSNXX =
    localStorage.getItem(
        "snxxLastSoldPrice"
    );

if (savedSNXX !== null) {

    document.getElementById(
        "snxxSold"
    ).value = savedSNXX;

}


// Load SNDKB

const savedSNDKB =
    localStorage.getItem(
        "sndkbLastSoldPrice"
    );

if (savedSNDKB !== null) {

    document.getElementById(
        "sndkbSold"
    ).value = savedSNDKB;

}


// =====================================================
// FORMAT PRICE
// =====================================================

function formatPrice(price) {

    return Number(price)
        .toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 6,
                maximumFractionDigits: 8
            }
        );

}


// =====================================================
// CALCULATE PERCENT CHANGE
// =====================================================

function calculateChange(
    livePrice,
    soldPrice
) {

    if (
        livePrice === null ||
        soldPrice === null ||
        soldPrice <= 0
    ) {

        return null;

    }

    return (
        (livePrice - soldPrice)
        / soldPrice
    ) * 100;

}


// =====================================================
// UPDATE SNXX
// =====================================================

function updateSNXX() {

    const sold =
        parseFloat(
            document.getElementById(
                "snxxSold"
            ).value
        );


    const change =
        calculateChange(
            snxxPrice,
            sold
        );


    if (change === null) {

        document.getElementById(
            "snxxChange"
        ).innerText = "--";

    } else {

        const sign =
            change >= 0
                ? "+"
                : "";

        document.getElementById(
            "snxxChange"
        ).innerText =
            sign +
            change.toFixed(2) +
            "%";

    }

}


// =====================================================
// UPDATE SNDKB
// =====================================================

function updateSNDKB() {

    const sold =
        parseFloat(
            document.getElementById(
                "sndkbSold"
            ).value
        );


    const change =
        calculateChange(
            sndkbPrice,
            sold
        );


    if (change === null) {

        document.getElementById(
            "sndkbChange"
        ).innerText = "--";

    } else {

        const sign =
            change >= 0
                ? "+"
                : "";

        document.getElementById(
            "sndkbChange"
        ).innerText =
            sign +
            change.toFixed(2) +
            "%";

    }

}


// =====================================================
// SNXX INPUT EVENT
// =====================================================

document.getElementById(
    "snxxSold"
).addEventListener(
    "input",
    function() {

        // Save SNXX price
        localStorage.setItem(
            "snxxLastSoldPrice",
            this.value
        );

        // Recalculate percentage
        updateSNXX();

    }
);


// =====================================================
// SNDKB INPUT EVENT
// =====================================================

document.getElementById(
    "sndkbSold"
).addEventListener(
    "input",
    function() {

        // Save SNDKB price
        localStorage.setItem(
            "sndkbLastSoldPrice",
            this.value
        );

        // Recalculate percentage
        updateSNDKB();

    }
);


// =====================================================
// CLEAR SNXX SAVED PRICE
// =====================================================

document.getElementById(
    "clearSnxx"
).addEventListener(
    "click",
    function() {

        // Delete from localStorage
        localStorage.removeItem(
            "snxxLastSoldPrice"
        );

        // Clear input
        document.getElementById(
            "snxxSold"
        ).value = "";

        // Reset percentage
        updateSNXX();

    }
);


// =====================================================
// CLEAR SNDKB SAVED PRICE
// =====================================================

document.getElementById(
    "clearSndkb"
).addEventListener(
    "click",
    function() {

        // Delete from localStorage
        localStorage.removeItem(
            "sndkbLastSoldPrice"
        );

        // Clear input
        document.getElementById(
            "sndkbSold"
        ).value = "";

        // Reset percentage
        updateSNDKB();

    }
);


// =====================================================
// BINANCE SNXXBUSDT
// =====================================================

const snxxWS =
    new WebSocket(
        "wss://stream.binance.com:9443/ws/snxxbusdt@ticker"
    );


snxxWS.onopen = function() {

    document.getElementById(
        "snxxStatus"
    ).innerText =
        "● LIVE";

};


snxxWS.onmessage = function(event) {

    const data =
        JSON.parse(event.data);


    snxxPrice =
        parseFloat(data.c);


    document.getElementById(
        "snxxPrice"
    ).innerText =
        "$" +
        formatPrice(snxxPrice);


    document.getElementById(
        "snxxUpdated"
    ).innerText =
        "Last update: " +
        new Date().toLocaleTimeString();


    updateSNXX();

};


snxxWS.onerror = function() {

    document.getElementById(
        "snxxStatus"
    ).innerText =
        "● Connection error";

};


snxxWS.onclose = function() {

    document.getElementById(
        "snxxStatus"
    ).innerText =
        "● Disconnected";

};


// =====================================================
// BINANCE SNDKBUSDT
// =====================================================

const sndkbWS =
    new WebSocket(
        "wss://stream.binance.com:9443/ws/sndkbusdt@ticker"
    );


sndkbWS.onopen = function() {

    document.getElementById(
        "sndkbStatus"
    ).innerText =
        "● LIVE";

};


sndkbWS.onmessage = function(event) {

    const data =
        JSON.parse(event.data);


    sndkbPrice =
        parseFloat(data.c);


    document.getElementById(
        "sndkbPrice"
    ).innerText =
        "$" +
        formatPrice(sndkbPrice);


    document.getElementById(
        "sndkbUpdated"
    ).innerText =
        "Last update: " +
        new Date().toLocaleTimeString();


    updateSNDKB();

};


sndkbWS.onerror = function() {

    document.getElementById(
        "sndkbStatus"
    ).innerText =
        "● Connection error";

};


sndkbWS.onclose = function() {

    document.getElementById(
        "sndkbStatus"
    ).innerText =
        "● Disconnected";

};


</script>

</body>

</html>
